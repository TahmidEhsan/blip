<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{text:TITLE}} · Blip</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/fonts/bangers/latin-400.css">
  <link rel="stylesheet" href="/vendor/fonts/comic-neue/latin-400.css">
  <link rel="stylesheet" href="/vendor/fonts/comic-neue/latin-700.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
</head>
<body class="page page--unavailable">
  <div class="bg" aria-hidden="true"><div class="bg-dots"></div><div class="bg-dots bg-dots--red"></div><div class="bg-dots bg-dots--blue"></div></div>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header container">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">blip</span></a>
  </header>

  <main class="page-main container" id="main">
    <section class="panel visit-panel" aria-labelledby="unavailable-heading">
      <p class="caption caption--corner">Error 503: not connected</p>
      <span class="visit-icon" aria-hidden="true"><svg class="icon" focusable="false"><use href="/assets/icons.svg#unplug"></use></svg></span>
      <h1 class="visit-heading visit-heading--sm" id="unavailable-heading">{{text:TITLE}}</h1>
      <p class="visit-copy">{{text:MESSAGE}}</p>
      <p class="visit-tip visit-tip--flush">Got here from a short link? Try it again a little later.</p>
    </section>
  </main>

  <footer class="site-footer container page-footer">
    <p class="footer-made">Made with <a href="/">Blip</a>. Tiny links with big personality.</p>
  </footer>
</body>
</html>
